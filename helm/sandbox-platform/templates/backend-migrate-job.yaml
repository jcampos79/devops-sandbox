# Runs `alembic upgrade head` before the backend Deployment is
# created/updated, using ArgoCD/Helm hooks. Without this, a fresh install
# (or one that adds new migrations) leaves the database schema missing --
# see README Troubleshooting "relation ... does not exist" for exactly the
# failure this prevents.
#
# hook-delete-policy ensures old completed Job objects don't pile up across
# releases (Jobs are immutable, so Helm can't just update one in place).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sandbox-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "sandbox-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "sandbox-platform.selectorLabels" (dict "context" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "sandbox-platform.fullname" . }}-backend-config
            - secretRef:
                name: {{ .Values.backend.existingSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
