apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-platform.fullname" . }}-backend
  labels:
    {{- include "sandbox-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "sandbox-platform.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
