apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox-platform.fullname" . }}-backend
  labels:
    {{- include "sandbox-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "sandbox-platform.selectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sandbox-platform.selectorLabels" (dict "context" . "component" "backend") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccount.name | default (printf "%s-backend" (include "sandbox-platform.fullname" .)) }}
      initContainers:
        # Runs `alembic upgrade head` before the backend container starts.
        # Deliberately an initContainer on this Deployment rather than a
        # separate Helm hook Job: it shares this pod's ConfigMap/Secret
        # (no hook-ordering-vs-chart-resources problem to reason about),
        # and Kubernetes retries a failing initContainer using the pod's
        # own restart/backoff behavior -- no separate backoffLimit/
        # activeDeadlineSeconds/hook-delete-policy bookkeeping needed.
        # Waits for Postgres to actually accept connections first (the
        # StatefulSet may exist as an object before its pod is Ready).
        #
        # Note: with backend.replicas > 1, more than one pod could start
        # this initContainer around the same time. `alembic upgrade head`
        # is idempotent once a migration has applied, but two pods racing
        # to apply the SAME not-yet-applied migration concurrently could
        # collide. Not a concern at the default replicas: 1, and adding
        # migration leader-election would be over-engineering for a
        # training platform -- if you scale the backend up, consider
        # running migrations as a separate one-off step in your deploy
        # process instead.
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}a
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - |
              python -c "
              import socket, time, sys
              host = '{{ include "sandbox-platform.fullname" . }}-postgresql'
              for attempt in range(60):
                  try:
                      socket.create_connection((host, 5432), timeout=2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              print(f'Timed out waiting for {host}:5432', file=sys.stderr)
              sys.exit(1)
              " && cd /app && alembic upgrade head
          envFrom:
            - configMapRef:
                name: {{ include "sandbox-platform.fullname" . }}-backend-config
            - secretRef:
                name: {{ .Values.backend.existingSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "sandbox-platform.fullname" . }}-backend-config
            - secretRef:
                name: {{ .Values.backend.existingSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
